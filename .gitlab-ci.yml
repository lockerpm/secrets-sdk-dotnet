stages:
  - validate
  - release

# Protect the canonical SemVer tag pattern, the nuget environment,
# NUGET_API_KEY, and the independent LOCKER_CLI_RELEASE_PUBLIC_KEY in GitLab
# settings. The stable public key must also be committed to
# src/Locker/locker-cli-release.json through normal review; CI never writes it.
validate:
  stage: validate
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    LOCKER_RUN_LIVE_TESTS: "0"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  script:
    - powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\verify-ci-supply-chain.ps1
    - $requiredSdk = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
    - $actualSdk = (& dotnet --version).Trim(); if ($LASTEXITCODE -ne 0 -or $actualSdk -ne $requiredSdk) { throw "required .NET SDK $requiredSdk, got $actualSdk" }
    - dotnet --info
    - dotnet restore src/Locker.sln --locked-mode
    - dotnet restore tools/Locker.ReleaseVerifier/Locker.ReleaseVerifier.csproj --locked-mode
    - dotnet format src/Locker.sln --verify-no-changes --no-restore
    - dotnet format tools/Locker.ReleaseVerifier/Locker.ReleaseVerifier.csproj --verify-no-changes --no-restore
    - dotnet build src/Locker.sln --configuration Release --no-restore
    - dotnet test src/LockerTests/LockerTests.csproj --configuration Release --no-build --no-restore
    - New-Item -ItemType Directory -Path artifacts -Force | Out-Null
    - dotnet list src/Locker.sln package --vulnerable --include-transitive --format json --output-version 1 | Set-Content -LiteralPath artifacts/nuget-vulnerabilities.json -Encoding utf8
    - powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\assert-no-vulnerable-packages.ps1 -ReportPath artifacts/nuget-vulnerabilities.json
    - dotnet pack src/Locker/Locker.csproj --configuration Release --no-build --no-restore --output artifacts
    - dotnet publish tools/Locker.ReleaseVerifier/Locker.ReleaseVerifier.csproj --configuration Release --no-restore --output artifacts/release-verifier
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/
  tags:
    - win01
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

publish-nuget:
  stage: release
  interruptible: false
  resource_group: nuget
  needs:
    - job: validate
      artifacts: true
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  script:
    - powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\verify-ci-supply-chain.ps1
    - $requiredSdk = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
    - $actualSdk = (& dotnet --version).Trim(); if ($LASTEXITCODE -ne 0 -or $actualSdk -ne $requiredSdk) { throw "required .NET SDK $requiredSdk, got $actualSdk" }
    - $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
    - $package = "artifacts/lockersm.$version.nupkg"
    - $verifier = "artifacts/release-verifier/Locker.ReleaseVerifier.dll"
    - if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw "NUGET_API_KEY protected variable is missing" }
    - if ([string]::IsNullOrWhiteSpace($env:LOCKER_CLI_RELEASE_PUBLIC_KEY)) { throw "LOCKER_CLI_RELEASE_PUBLIC_KEY protected independent variable is missing" }
    - powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\verify-release.ps1 -Tag $env:CI_COMMIT_TAG -PublicKey $env:LOCKER_CLI_RELEASE_PUBLIC_KEY -PackagePath $package -VerifierPath $verifier
    - dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  tags:
    - win01
  environment:
    name: nuget
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$/'
      when: manual
      allow_failure: false
    - when: never
