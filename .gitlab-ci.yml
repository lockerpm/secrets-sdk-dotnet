stages:
  - validate
  - release

workflow:
  # A release version is derived from first-parent history, so overlapping main
  # pipelines must all finish instead of allowing a newer merge to cancel one.
  auto_cancel:
    on_new_commit: none
  rules:
    # The release job creates vX.Y.Z. Never recursively start a tag pipeline.
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

default:
  image: "mcr.microsoft.com/dotnet/sdk:8.0.423-bookworm-slim@sha256:3c0edbfe1549dd93fb789dc96299a40df865ad7bffefcaf38e8c05940686d641"
  tags:
    - cs_newgen_docker

# Protect main, v* tags, the nuget environment, NUGET_API_KEY, and the
# independent single-line LOCKER_CLI_RELEASE_PUBLIC_KEY in GitLab settings.
validate:
  stage: validate
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    LOCKER_RUN_LIVE_TESTS: "0"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  script:
    - pwsh -NoProfile -NonInteractive -File ./scripts/run-ci-validation.ps1
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/

auto-release:
  stage: release
  interruptible: false
  # Configure this resource group once with process_mode=oldest_first.
  # The predecessor-tag gate remains the fail-closed release-order invariant.
  resource_group: lockersm-nuget
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure
      - script_failure
      - stuck_or_timeout_failure
  dependencies: []
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    LOCKER_RUN_LIVE_TESTS: "0"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
    GIT_DEPTH: "0"
  environment:
    name: nuget
    deployment_tier: production
  script:
    - pwsh -NoProfile -NonInteractive -File ./scripts/run-ci-release.ps1
  artifacts:
    name: lockersm-dotnet-release-$CI_COMMIT_SHA
    when: always
    paths:
      - release-dist/
      - release.env
    expire_in: 30 days
  rules:
    # Keep this job visible and failing if branch protection is misconfigured.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
