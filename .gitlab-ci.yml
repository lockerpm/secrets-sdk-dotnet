stages:
  - validate
  - release

workflow:
  # The release job creates vX.Y.Z. Never recursively start a tag pipeline
  # for anything but a reviewed release tag.
  auto_cancel:
    on_new_commit: none
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

default:
  image: "mcr.microsoft.com/dotnet/sdk:8.0.423-bookworm-slim@sha256:3c0edbfe1549dd93fb789dc96299a40df865ad7bffefcaf38e8c05940686d641"
  tags:
    - cs_newgen_docker

# Protect main and v* tags (Allowed to create: Maintainers) in GitLab project
# settings, plus the nuget environment, NUGET_API_KEY, and the independent
# single-line LOCKER_CLI_RELEASE_PUBLIC_KEY.
validate:
  stage: validate
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    LOCKER_RUN_LIVE_TESTS: "0"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  script:
    - pwsh -NoProfile -NonInteractive -File ./scripts/run-ci-validation.ps1
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/
  rules:
    - if: '$CI_COMMIT_BRANCH'

release:
  stage: release
  interruptible: false
  # Configure this resource group once with process_mode=oldest_first, so two
  # tags pushed close together still publish to NuGet one at a time.
  resource_group: lockersm-nuget
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure
      - script_failure
      - stuck_or_timeout_failure
  dependencies: []
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    LOCKER_RUN_LIVE_TESTS: "0"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
    GIT_DEPTH: "0"
  environment:
    name: nuget
    deployment_tier: production
  script:
    - pwsh -NoProfile -NonInteractive -File ./scripts/run-ci-release.ps1
  artifacts:
    name: lockersm-dotnet-release-$CI_COMMIT_SHA
    when: always
    paths:
      - release-dist/
      - release.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
